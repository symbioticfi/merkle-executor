name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    env:
      GOPRIVATE: github.com/symbioticfi/merkle-executor
      MERKLE_SDK_READ_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - run: bash hack/configure-private-go-modules.sh
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true
      - run: make check
      - run: make generate && git diff --exit-code -- api sdk/bindings
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.1
      - run: make integration
