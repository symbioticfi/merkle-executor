name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    env:
      GOPRIVATE: github.com/symbioticfi/merkle-executor
      MERKLE_SDK_READ_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - run: bash hack/configure-private-go-modules.sh
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true
      - run: make check
      - run: make generate && git diff --exit-code -- api sdk/bindings
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.1
      - run: make integration

      - name: Verify container build metadata
        env:
          DOCKER_BUILDKIT: '1'
        run: |
          build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          docker build --secret id=merkle_sdk_read_token,env=MERKLE_SDK_READ_TOKEN \
            --build-arg VERSION=ci --build-arg COMMIT="$GITHUB_SHA" --build-arg DATE="$build_date" \
            -f deploy/Dockerfile -t merkle-executor:ci .
          test "$(docker run --rm merkle-executor:ci version)" = "ci ($GITHUB_SHA, $build_date)"
