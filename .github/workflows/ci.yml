name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true
      - run: make check
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.1
      - run: make generate && git diff --exit-code -- api sdk/bindings sdk/recipes/lens
      - run: make integration

      - env:
          DOCKER_BUILDKIT: '1'
        run: |
          build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          docker build --build-arg VERSION=ci --build-arg COMMIT="$GITHUB_SHA" --build-arg DATE="$build_date" \
            -f deploy/Dockerfile -t merkle-executor:ci .
          test "$(docker run --rm merkle-executor:ci version)" = "ci ($GITHUB_SHA, $build_date)"
