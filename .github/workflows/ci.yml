name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true
      - run: make check
      - run: make generate && git diff --exit-code -- api
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.1
      - run: make integration
