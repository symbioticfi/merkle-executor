name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # pin@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: '**/go.sum'
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # pin@v1.9.2
        with:
          version: v1.8.6
      - run: make check
      - run: make generate && git diff --exit-code -- sdk/bindings sdk/protocoltypes sdk/recipes/lens sdk/providers/aave/lens
      - run: make integration

      - env:
          DOCKER_BUILDKIT: '1'
        run: |
          build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          docker build --build-arg VERSION=ci --build-arg COMMIT="$GITHUB_SHA" --build-arg DATE="$build_date" \
            -f deploy/Dockerfile -t merkle-executor:ci .
          test "$(docker run --rm merkle-executor:ci version)" = "ci ($GITHUB_SHA, $build_date)"
